<!doctype html>
<html lang="pt-BR" data-look="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'self'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finora">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F2A44">
<script>window.FINORA_PWA=true;if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
<title>Finora</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Finora — dois visuais (A: Clara, barra lateral; B: Noite, barra superior) e paletas de cor escolhidas em Opções › Aparência. */
:root,[data-look="a"]{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#E3E9EE; --soft:#F4F7F9; --ink:#131C26; --muted:#5A6672; --line:#D4DCE3;
  --accent:#14806F; --accent-ink:#FFFFFF; --accent-soft:#D3EEE8; --accent-strong:#0E5E52;
  --in:#1D8049; --out:#B3361F; --danger:#B3361F; --danger-soft:#FDF3F0;
  --side-bg:#0F2A44; --side-ink:#FFFFFF; --side-muted:rgba(255,255,255,.72); --side-label:rgba(255,255,255,.5); --side-active:rgba(255,255,255,.14);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px; --r-lg:12px; color-scheme:light;
}
[data-look="b"]{
  --bg:#111826; --surface:#1A2334; --sunk:#232D42; --soft:#111826; --ink:#E8ECF4; --muted:#9AA6BD; --line:#2E3A52;
  --accent:#3CCFB4; --accent-ink:#04201B; --accent-soft:rgba(60,207,180,.15); --accent-strong:#8BE8D6;
  --in:#5DD39E; --out:#FF8A73; --danger:#FF8A73; --danger-soft:rgba(255,138,115,.1);
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px; --r-lg:18px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ic{width:20px;height:20px;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pos{color:var(--in)}.neg{color:var(--out)}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1.title{margin:0;font:700 26px/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
[data-look="b"] h1.title{font-size:22px;font-weight:600}

/* ---------- estrutura ---------- */
.shell{display:grid;min-height:100vh}
.side{grid-area:side}.topbar{grid-area:top}.main{grid-area:main;min-width:0}.dock{grid-area:dock;min-width:0}
[data-look="a"] .shell{grid-template-columns:250px minmax(0,1fr) 380px;grid-template-areas:"side main dock"}
[data-look="a"] .shell.nodock{grid-template-columns:250px minmax(0,1fr);grid-template-areas:"side main"}
[data-look="a"] .topbar{display:none}
[data-look="b"] .shell{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto 1fr;grid-template-areas:"top top" "main dock";align-items:start}
[data-look="b"] .shell.nodock{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
[data-look="b"] .side{display:none}
.shell.nodock .dock{display:none}
.logo{width:40px;height:40px;border-radius:10px;flex:none;display:block}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font:700 22px/1 var(--f-display);letter-spacing:-.01em}

/* barra lateral (A) */
.side{background:var(--side-bg);color:var(--side-ink);padding:24px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav .lbl{color:var(--side-label);padding:8px 12px 4px}
.side nav button{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;border:0;background:transparent;color:var(--side-muted);text-align:left;font-weight:500;font-size:14.5px}
.side nav button[aria-current="page"]{background:var(--side-active);color:var(--side-ink);font-weight:600}
.side nav button:hover{background:var(--side-active)}
.accts{display:flex;flex-direction:column;gap:2px}
.accts .lbl{color:var(--side-label);padding:0 10px 6px}
.accts{border-top:1px solid rgba(255,255,255,.16);margin-top:14px;padding-top:16px}
.accts>.lbl{font-size:12.5px;letter-spacing:.08em}
.accts .since{color:var(--side-muted);font-size:13px;padding:0 10px 8px;margin-top:-4px}
.accts .tot{display:flex;flex-direction:column;gap:2px;padding:6px 10px;font-size:14px;color:var(--side-muted)}
.accts .tot .num{color:var(--side-ink);font-size:19px;white-space:nowrap}
.accts .tot .num.in{color:#6EE7A8}.accts .tot .num.out{color:#FF9B85}
.accts .tot .hint{font-size:11.5px;color:var(--side-muted);font-weight:400}
.accts .tot.sum{border-top:1px solid rgba(255,255,255,.14);margin-top:4px;padding-top:9px;color:var(--side-ink);font-weight:600}
.accts .sidesel{margin:12px 6px 0;background:rgba(255,255,255,.08);color:var(--side-ink);border-color:rgba(255,255,255,.18);font-size:13px}
.accts .sidesel option{color:#13201C}
.accts button{display:flex;justify-content:space-between;gap:8px;border:0;background:transparent;color:var(--side-muted);padding:5px 10px;border-radius:7px;font-size:13.5px;text-align:left}
.accts button span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accts button[aria-pressed="true"]{background:var(--side-active);color:var(--side-ink)}
.accts .num{color:var(--side-ink);flex:none}

/* barra superior (B) */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:20px 32px 6px;position:relative}
.topbar nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap}
.topbar nav button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;display:flex;gap:7px;align-items:center}
.topbar nav button .ic{width:16px;height:16px}
.topbar nav button[aria-current="page"],.topbar nav button[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.topright{display:flex;gap:8px;align-items:center}
.optmenu{position:absolute;z-index:20;top:70px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;min-width:240px}
.optmenu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);text-align:left;padding:10px 12px;border-radius:9px;font-weight:600}
.optmenu button:hover,.optmenu button[aria-current="page"]{background:var(--sunk)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none;padding:0}
[data-look="a"] .iconbtn{border-radius:50%}

/* principal */
.main{padding:26px 32px 110px;display:flex;flex-direction:column;gap:18px;container-type:inline-size}
[data-look="b"] .main{padding-top:16px}
.vhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 13px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
[data-look="b"] .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.segv{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.segv button{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px}
.segv button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
[data-look="b"] .segv button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:4px 6px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);padding:10px 14px;border-radius:var(--r);font-size:14px}
.banner button{margin-left:auto;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.summary{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));overflow:hidden}
.summary>div{padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.summary strong{font-size:18px;font-weight:500;white-space:nowrap}
@container (min-width: 560px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@container (min-width: 820px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toprow{display:grid;grid-template-columns:24px minmax(0,150px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.toprow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}
.bub{border-radius:50%;display:grid;place-items:center;flex:none}
.bub .ic{width:58%;height:58%}
.hero{padding:22px 24px;display:flex;flex-direction:column;gap:4px}
.hero .amt{font-size:36px;line-height:1.1}
.kpis{display:flex;gap:24px;margin-top:10px;flex-wrap:wrap}
.kpis small{display:block;color:var(--muted);font-size:12px}
.kpis .num{font-size:18px}

/* lista por dia (A) */
.ledger{display:flex;flex-direction:column;gap:14px}
.day{overflow:hidden}
.dayhead{display:flex;justify-content:space-between;padding:8px 18px;background:var(--sunk);font-size:13px;color:var(--muted);font-weight:600}
.dayhead span:first-child::first-letter{text-transform:uppercase}
.row{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;text-align:left;padding:10px 18px;border-top:1px solid var(--sunk)}
.dayhead+.row{border-top:0}
.row:hover{background:var(--soft)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flush{margin:0 -18px -18px}

/* tabela (B) */
.table{overflow:hidden}
.thead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;flex-wrap:wrap}
.thead h2{margin:0;font:600 18px var(--f-display)}
.tscroll{overflow-x:auto}
.tgrid{min-width:620px}
.tr{display:grid;grid-template-columns:96px minmax(0,1fr) 140px 140px;gap:12px;align-items:center;padding:10px 22px;border:0;border-bottom:1px solid var(--sunk);width:100%;background:transparent;text-align:left}
button.tr:hover{background:var(--sunk)}
.tr.th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:8px}
.tr .cat{display:flex;align-items:center;gap:10px;min-width:0}
.tr .cat span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{text-align:right}
.tr .m{color:var(--muted);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:36px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg)}
.empty b{display:block;color:var(--ink);font:600 18px var(--f-display);margin-bottom:4px}
.more{align-self:center}

/* calendário */
.calwrap{padding:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calgrid .wd{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 4px 4px}
.cday{min-height:88px;border-radius:10px;border:2px solid transparent;background:var(--soft);padding:7px 8px;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;min-width:0}
[data-look="b"] .cday{background:var(--sunk)}
.cday:hover{border-color:var(--line)}
.cday .d{font-weight:700;font-size:14px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin:-2px 0 2px -3px}
.cday.today .d{background:var(--accent);color:var(--accent-ink)}
.cday[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cday .v{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cday.blank{background:transparent;pointer-events:none}
@media (max-width:760px){.cday{min-height:64px;padding:5px}.cday .v{font-size:10px}}

/* relatórios */
.rtab{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr)) 64px;gap:10px;align-items:center;padding:10px 18px;border:0;border-bottom:1px solid var(--sunk);background:transparent;width:100%;text-align:left}
button.rrow:hover{background:var(--soft)}
.rrow.th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
.rrow.tot{font-weight:700;border-bottom:0;background:var(--sunk)}
.rscroll{overflow-x:auto}.rscroll>.rtab{min-width:560px}
.catitem{border-top:1px solid var(--sunk)}
.catitem:first-child{border-top:0}
.catbtn{display:grid;grid-template-columns:36px minmax(0,1fr) auto 20px;gap:4px 12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 18px}
.catbtn:hover{background:var(--soft)}
.catbtn .bub{grid-row:1/4}
.catbtn .track{grid-column:2/4}
.catbtn .meta{grid-column:2/4;color:var(--muted);font-size:13px}
.catbtn .chev{grid-row:1/4;grid-column:4;color:var(--muted);transition:transform .15s}
.catbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.catentries{background:var(--soft);padding:4px 0}
.catentries .row{padding-left:66px}
details.zero{padding:12px 18px;border-top:1px solid var(--line)}
details.zero summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:600}
.zerolist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.zerolist span{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox text{fill:var(--muted);font:11px var(--f-body)}
.chartbox .grid{stroke:var(--line)}
.chartbox .b-in{fill:var(--in)}.chartbox .b-out{fill:var(--out)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}

/* painel de lançamento */
[data-look="a"] .dock{background:var(--surface);border-left:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
[data-look="a"] .dock form{padding:26px 22px 40px}
[data-look="b"] .dock{padding:16px 32px 40px 0;position:sticky;top:0;max-height:100vh;overflow:auto}
[data-look="b"] .dock form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.lform{display:flex;flex-direction:column;gap:16px}
.lform h2{margin:0;font:600 22px var(--f-display);display:flex;align-items:center;justify-content:space-between;gap:8px}
[data-look="b"] .lform h2{font-size:19px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:9px;border-radius:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button.o[aria-pressed="true"]{color:var(--out)}.seg button.i[aria-pressed="true"]{color:var(--in)}
[data-look="b"] .seg{background:transparent;gap:8px;padding:0}
[data-look="b"] .seg button{border:1px solid var(--line)}
[data-look="b"] .seg button.o[aria-pressed="true"]{border-color:var(--out);background:var(--danger-soft);box-shadow:none}
[data-look="b"] .seg button.i[aria-pressed="true"]{border-color:var(--in);background:rgba(93,211,158,.1);box-shadow:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select,.inp{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:9px 12px;width:100%;min-width:0;color:var(--ink)}
.field input.big{font:500 26px var(--f-num);padding:8px 12px}
[data-look="b"] .field input.big{border:0;border-bottom:2px solid var(--accent);border-radius:0;background:transparent;font-size:32px;padding:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:14px;min-height:1.2em;margin:0}
.formact{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:11px 18px;font-weight:700}
[data-look="b"] .btn{border-radius:12px}
.btn.sec{background:var(--sunk);color:var(--ink)}
.btn.small{padding:7px 14px;font-size:13px}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.ghost{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.ghost.danger{color:var(--danger);border-color:var(--danger)}
.ghost:disabled{opacity:.45;cursor:not-allowed}

/* seletor de categoria */
.picker{display:flex;flex-direction:column;gap:8px}
.picker .search{flex:none}
.pkwrap{position:relative}
.pkdrop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(10,20,40,.18);max-height:290px;overflow-y:auto;padding:4px}
.pkdrop[hidden]{display:none}
.pkdh{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.pkopt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:6px 10px;border-radius:8px;text-align:left;color:var(--ink);font-size:14px}
.pkopt:hover,.pkopt:focus{background:var(--accent-soft);outline:none}
.pkopt.on{background:var(--accent-soft);font-weight:700}
.pkopt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkopt .ct{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pickhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pickhead button{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;padding:2px 4px}
.pickhead button .ic{width:15px;height:15px}
.pickhint{margin:0;font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tilew{position:relative;min-width:0}
.tile{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;border:2px solid transparent;background:var(--soft);font-size:12px;color:var(--ink);min-width:0}
[data-look="b"] .tile{background:transparent}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tile .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tile.add{border:2px dashed var(--line);background:transparent;color:var(--accent);font-weight:700}
.tile.add .bub{background:var(--accent-soft);color:var(--accent)}
.xdel{position:absolute;top:-4px;right:2px;width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);background:var(--danger);color:#fff;display:grid;place-items:center;padding:0}
.xdel .ic{width:12px;height:12px;stroke-width:2.6}
.panel2{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel2[data-ctx="t"]{max-width:640px}
.panel2.danger{border-color:var(--danger);background:var(--danger-soft)}
.panel2 h3{margin:0;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
.ill{display:block;width:100%;height:100%;overflow:visible}
.ill .bg{fill:var(--i-bg)}.ill .p{fill:var(--i-p)}.ill .d{fill:var(--i-d)}.ill .l{fill:var(--i-l)}.ill .w{fill:var(--i-w)}.ill .o{fill:#FF8A3D}.ill .y{fill:#FFC53D}.ill .b{fill:#C9672E}.ill .k{fill:#F7B58C}.ill .dt1{fill:#FFC53D}.ill .dt2{fill:#FF8A3D}
.ill .wo{fill:var(--i-w);stroke:var(--i-p);stroke-width:2.4}
.ill .so,.ill .sw,.ill .sd,.ill .sp,.ill .sy,.ill .sl{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ill .so{stroke:#FF8A3D}.ill .sw{stroke:var(--i-w)}.ill .sd{stroke:var(--i-d)}.ill .sp{stroke:var(--i-p)}.ill .sy{stroke:#FFC53D}.ill .sl{stroke:var(--i-l)}
:root{--i-bg:#E4ECFF;--i-p:#3D6BF0;--i-d:#2347B5;--i-l:#93B3FF;--i-w:#FFFFFF}
[data-look="b"]{--i-bg:#22305A;--i-p:#4F7DFF;--i-d:#2F56D0;--i-l:#9DB8FF;--i-w:#F2F6FF}
.bub.bill{background:transparent;overflow:visible}
.bub.bill .ill{width:100%;height:100%}
.tico{display:flex;width:26px;height:26px;flex:none}.tico .ic{width:20px;height:20px;margin:auto}
.icgrid button .ill{width:34px;height:34px}
.icprev{display:flex;gap:6px;justify-content:center;padding:10px 4px;width:100%}
.icprev i{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;flex:none}
.icprev i .ic{width:58%;height:58%}
.ichead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.icsearch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;color:var(--muted);flex:0 1 220px;min-width:0}
.icsearch .ic{width:15px;height:15px;flex:none}
.icsearch input{border:0;outline:0;background:transparent;font:inherit;font-size:13px;color:var(--ink);min-width:0;width:100%}
.icbox{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px 10px 10px;overscroll-behavior:contain}
.icgroup[hidden],.icgrid button[hidden],.icnone[hidden]{display:none!important}
.icgtitle{display:block;position:sticky;top:0;z-index:1;background:var(--surface);padding:8px 0 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.icgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;border-radius:10px;border:2px solid transparent;background:var(--soft);color:var(--muted);min-width:0;transition:background .12s,color .12s,transform .12s}
.icgrid button:hover{background:var(--accent-soft);color:var(--ink)}
.icgrid button:active{transform:scale(.96)}
.icgrid button .ic{width:22px;height:22px}
.icgrid button span{font-size:10.5px;line-height:1.2;max-width:100%;overflow:hidden;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.4em;padding:0 3px;hyphens:auto;-webkit-hyphens:auto}
.icgrid button[aria-pressed="true"] span{font-weight:700}
.icnone{padding:10px 2px;margin:0}
.cpick{position:relative;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);color:var(--muted);cursor:pointer;overflow:hidden}
.cpick .ic{width:14px;height:14px}
.cpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.dots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dots button{width:26px;height:26px;border-radius:50%;border:3px solid var(--surface);padding:0;box-shadow:0 0 0 1px var(--line)}
.dots button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.rowend{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* opções */
section.panel{padding:18px;display:flex;flex-direction:column;gap:12px}
section.panel h3{margin:0;font:600 18px var(--f-display)}
section.panel .sub{margin:-6px 0 0;color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.list{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow small{display:block;color:var(--muted);font-size:13px}
.budgetin{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.budgetin input{width:115px;border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:5px 8px;text-align:right;color:var(--ink)}
.acctrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.acctrow:first-child{border-top:0}
.acctrow input[type=text]{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-weight:600;color:var(--ink)}
.acctrow input[type=text]:hover,.acctrow input[type=text]:focus{border-color:var(--line);background:var(--soft)}
.acctrow small{display:block;color:var(--muted);font-size:13px;padding-left:6px}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline input,.inline select{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0;color:var(--ink)}
.inline input{flex:1 1 180px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:14px;margin:0}
.looks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.lookcard{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.lookcard[aria-pressed="true"],.pal[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lookcard .pv{height:96px;width:100%;border-radius:9px;display:flex;overflow:hidden;border:1px solid var(--line)}
.lookcard .pv span,.lookcard .pv i{display:block}
.lookcard b{font-size:15px}.lookcard small{color:var(--muted);font-size:13px}
.palettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pal{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink)}
.pal .sw{display:flex;width:100%;height:34px;border-radius:8px;overflow:hidden}
.pal .sw i{flex:1;display:block}
.pal b{font-size:14px}.pal small{color:var(--muted);font-size:12.5px}
.custom{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.custom input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0}
.facts div{background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0}
.facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
textarea.out{width:100%;min-height:140px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:10px;font:12px var(--f-num);color:var(--ink)}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:14px 20px;font-weight:700;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center;z-index:5}
dialog{border:0;border-radius:18px;padding:0;width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(5,12,20,.5)}
dialog form{padding:20px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100vw - 32px)}
footer.foot{color:var(--muted);font-size:13px;text-align:center}

@media (max-width:760px){
  [data-look="a"] .shell,[data-look="a"] .shell.nodock{grid-template-columns:minmax(0,1fr);grid-template-areas:"side" "main"}
  .side{position:static;height:auto;gap:10px;padding:14px 16px}
  .side nav{flex-direction:row;flex-wrap:wrap}
  .side nav .lbl{display:none}
  .side nav button span{display:none}
  .side .accts{display:none}
  .main{padding:18px 16px 110px}
  .topbar{padding:16px 16px 4px}
  .lrow{grid-template-columns:auto minmax(0,1fr) auto}.lrow .budgetin{grid-column:2/-1}
}
@media (prefers-reduced-motion:no-preference){.row,.chip,.tile,.side nav button,.cday{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="shell nodock" id="shell">
  <aside class="side" id="side"></aside>
  <header class="topbar" id="topbar"></header>
  <main class="main">
    <div class="banner" id="banner" hidden></div>
    <div id="view"></div>
    <footer class="foot" id="foot"></footer>
  </main>
  <aside class="dock" id="dock" aria-label="Lançamento"></aside>
</div>
<button class="fab" id="fab" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Lançamento</button>
<dialog id="dlg"></dialog>
<form class="lform" id="lform" novalidate></form>
<div class="toast" id="toast" hidden></div>

const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmt=c=>BRL.format((c||0)/100);
const fmtShort=c=>{const v=Math.abs(c)/100;return v>=1000?v.toLocaleString('pt-BR',{maximumFractionDigits:0}):v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});};
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const todayISO=()=>toISO(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const $=id=>document.getElementById(id);
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x';
const byName=(a,b)=>a.name.localeCompare(b.name,'pt-BR');
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
function parseMoney(s){s=String(s).trim().replace(/R\$|\s/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const v=parseFloat(s);return isFinite(v)?Math.round(v*100):NaN;}
const centsToInput=c=>(c/100).toFixed(2).replace('.',',');
function addDays(iso,n){const d=fromISO(iso);d.setDate(d.getDate()+n);return toISO(d);}
function addMonths(iso,n,day){const d=fromISO(iso);const y=d.getFullYear(),m=d.getMonth()+n;const last=new Date(y,m+1,0).getDate();return toISO(new Date(y,m,Math.min(day??d.getDate(),last)));}
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const monthKey=iso=>iso.slice(0,7);
function nowTime(){const d=new Date();let h=d.getHours();const ap=h<12?'am':'pm';h=h%12||12;return `${pad(h)}:${pad(d.getMinutes())} ${ap}`;}
function time24(t){const m=/^(\d{1,2}):(\d{2})\s*([ap]m)?/i.exec(t||'');if(!m)return '1200';let h=+m[1];const ap=(m[3]||'').toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;return pad(h)+m[2];}
function weekOfYear(iso){const d=fromISO(iso),y=d.getFullYear(),jan1=new Date(y,0,1);const yday=Math.round((d-jan1)/864e5),off=(jan1.getDay()+6)%7;const dow=(d.getDay()+6)%7,sunday=new Date(y,d.getMonth(),d.getDate()+(6-dow));return sunday.getFullYear()>y?1:Math.floor((yday+off)/7)+1;}
function hexRgb(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16,(n>>8)&255,n&255];}
const rgbHex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const rgba=(h,a)=>{const [r,g,b]=hexRgb(h);return `rgba(${r},${g},${b},${a})`;};
function mix(h,to,t){const a=hexRgb(h),b=hexRgb(to);return rgbHex(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t);}
function lum(h){const c=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}

let lsTimer=null,dirty=false;
function writeNow(){dirty=false;const json=JSON.stringify({app:'finora',version:3,saved:new Date().toISOString(),meta,tx:[...tx.values()]});
  if(D){let ok=false;try{ok=D.saveSync(json);}catch(e){}if(!ok) toast('Não foi possível gravar no disco. Verifique o espaço livre.');return;}
  if(PWA){IDB.set(LS_KEY,json).catch(()=>toast('Não foi possível guardar os dados neste aparelho. Faça um backup.'));return;}
  try{localStorage.setItem(LS_KEY,json);}catch(e){toast('O navegador não tem espaço para guardar tudo. Faça um backup.');}}
function saveLocal(){dirty=true;clearTimeout(lsTimer);lsTimer=setTimeout(writeNow,300);}
window.addEventListener('beforeunload',()=>{if(dirty){clearTimeout(lsTimer);writeNow();}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty){clearTimeout(lsTimer);writeNow();}});
function dbFail(e){const c=e&&e.code;toast(c==='quota_exceeded'?'Limite de armazenamento atingido.':'Não foi possível salvar agora. Tente de novo.');}
function saveMeta(){if(mode==='db'){metaSaved=true;return serial('meta',()=>withRetry(()=>metaRef.set(clone(meta)))).catch(dbFail);}if(mode==='local') saveLocal();return Promise.resolve();}
const pendingMonth=new Set();
function persistMonth(key){
  if(mode!=='db') return Promise.resolve();
  if(pendingMonth.has(key)) return chains['m_'+key];
  pendingMonth.add(key);
  return serial('m_'+key,()=>{pendingMonth.delete(key);const items={};let n=0;
    for(const t of tx.values()) if(monthKey(t.date)===key){const {demo,...c}=t;items[t.id]=c;n++;}
    const ref=monthsCol.doc(key);return withRetry(()=>n?ref.set({items}):ref.delete());});
}
function saveTx(t,opts={}){const old=tx.get(t.id);tx.set(t.id,t);
  if(mode==='db'){if(!metaSaved) saveMeta();const keys=new Set([monthKey(t.date)]);if(old) keys.add(monthKey(old.date));const p=Promise.all([...keys].map(persistMonth));if(!opts.quiet) p.catch(dbFail);if(!opts.quiet) render();return p;}
  if(mode==='local') saveLocal();if(!opts.quiet) render();return Promise.resolve();}
function deleteTx(id){const old=tx.get(id);if(!old)return;tx.delete(id);if(mode==='db') persistMonth(monthKey(old.date)).catch(dbFail); else if(mode==='local') saveLocal();render();}

/* ================= recorrências ================= */
function occurrence(r,k){const day=fromISO(r.start).getDate();if(r.freq==='week')return addDays(r.start,7*k);if(r.freq==='month')return addMonths(r.start,k,day);return addMonths(r.start,12*k,day);}
function runRecurring(){const today=todayISO();let changed=false;
  for(const r of meta.rules){for(let k=0;k<2000;k++){const d=occurrence(r,k);if(d>today)break;if(r.last&&d<=r.last)continue;const id=`r_${r.id}_${d}`;
    if(!tx.has(id)) saveTx({id,type:r.type,amount:r.amount,cat:r.cat,desc:r.desc,date:d,acc:r.acc||meta.accounts[0].id,rule:r.id,time:nowTime()},{quiet:true});r.last=d;changed=true;}}
  if(changed) saveMeta();}
function nextOccurrence(r){for(let k=0;k<2000;k++){const d=occurrence(r,k);if(!r.last||d>r.last)return d;}return null;}

const NAV=[['home','Tela inicial','inicio'],['mov','Movimentos','lista'],['cal','Calendário','calendario'],['rdata','Relatórios por data','grafico'],['rcat','Relatório por categoria','pizza']];
const OPT=[['cfg','Configurações básicas','ajustes'],['cats','Editar categorias','etiqueta'],['look','Aparência','paleta'],['bak','Backup','backup']];

try{const s=JSON.parse(localStorage.getItem('finora-ui')||'{}');for(const k of ['acc','look','palette','custom','movOrder','start','icons']) if(s[k]) ui[k]=s[k];}catch(e){}

  for(const t of tx.values()){if(monthKey(t.date)===cur){has=true;break;}if(t.date>max) max=t.date;}
  const ref=has||!max?todayISO():max;const d=fromISO(ref);const y=d.getFullYear(),m=d.getMonth()+1;
  Object.assign(ui,{movY:y,movM:m,calY:y,calM:m,calDay:ref,rdY:y,rdM:m,rcY:y,rcM:m,rcDay:ref});

function yearsList(){let mn=now.getFullYear(),mx=now.getFullYear();for(const t of tx.values()){const y=+t.date.slice(0,4);if(y<mn)mn=y;if(y>mx)mx=y;}const out=[];for(let y=mx;y>=mn;y--) out.push(y);return out;}
const yearSel=(id,v)=>`<select class="sel" id="${id}" aria-label="Ano">${yearsList().map(y=>`<option value="${y}" ${+v===y?'selected':''}>${y}</option>`).join('')}</select>`;
const monthSel=(id,v,all)=>`<select class="sel" id="${id}" aria-label="Mês">${all?`<option value="0" ${+v===0?'selected':''}>Ano inteiro</option>`:''}${MES.map((m,i)=>`<option value="${i+1}" ${+v===i+1?'selected':''}>${cap(m)}</option>`).join('')}</select>`;
const navBtns=(prev,next)=>`<button class="iconbtn" data-act="${prev}" aria-label="Anterior">${ic('esquerda')}</button><button class="iconbtn" data-act="${next}" aria-label="Próximo">${ic('direita')}</button>`;
function stepYM(y,m,dir){const t=y*12+(m-1)+dir;return [Math.floor(t/12),(t%12+12)%12+1];}

/* ================= cálculos ================= */
const catById=id=>meta.categories.find(c=>c.id===id)||{id,name:'Sem categoria',color:'#6C757D',icon:'outros',type:'out',budget:0};
const accOf=t=>t.acc||meta.accounts[0].id;
const accById=id=>meta.accounts.find(a=>a.id===id)||{id,name:'Conta removida',initial:0};
const accOk=t=>ui.acc==='all'||accOf(t)===ui.acc;
function inRange(s,e){const out=[];for(const t of tx.values()) if(t.date>=s&&t.date<=e&&accOk(t)) out.push(t);return out;}
/* Lançamentos que só transportam o saldo de um mês para o outro (ex.: categoria "Ajuste do mês Anterior.",
   descrição "Saldo mês anterior"). Não são receita nem despesa de verdade, por isso ficam fora do Resumo geral. */
const CARRY_RE=/(ajuste|acerto|saldo|residuo|sobra).{0,12}m[eê]s (anterior|passado)/;
function isCarryOver(t){const c=catById(t.cat);const cn=norm(c&&c.name||'').trim(),d=norm(t.desc||'').trim();
  return CARRY_RE.test(cn)||CARRY_RE.test(d)||/^ajustes?\b/.test(cn)||/^m[eê]s (anterior|passado)/.test(d);}
/* Ajuste de abertura do mês: receita de ajuste lançada nos primeiros dias (traz o dinheiro conferido). */
const isOpening=t=>t.type==='in'&&isCarryOver(t)&&+t.date.slice(8,10)<=5;
/* Resumo geral.
   Receitas e despesas totais: todo o período, sem os ajustes de mês anterior.
   Saldo atual: igual ao Gastos Diários — parte do último "ajuste do mês anterior" lançado
   (que é o dinheiro real conferido naquele mês) e soma tudo o que foi lançado depois. */
function cashSummary(){let i=0,o=0,first='',base='';const all=[...tx.values()];
  for(const t of all){if(isCarryOver(t)){if(isOpening(t)){const k=t.date.slice(0,7);if(k>base) base=k;}continue;}
    if(!first||t.date<first) first=t.date;if(t.type==='in') i+=t.amount;else o+=t.amount;}
  let saldo=0;
  if(base){for(const t of all) if(t.date.slice(0,7)>=base) saldo+=t.type==='in'?t.amount:-t.amount;}
  else saldo=i-o;
  return {i,o,saldo,first,base};}
function totals(list){let i=0,o=0;for(const t of list){if(t.type==='in')i+=t.amount;else o+=t.amount;}return {i,o,b:i-o,n:list.length};}
function balanceUntil(e){let b=0;for(const a of meta.accounts) if(ui.acc==='all'||a.id===ui.acc) b+=a.initial||0;for(const t of tx.values()) if(t.date<=e&&accOk(t)) b+=t.type==='in'?t.amount:-t.amount;return b;}
function accBalances(){const m=new Map(meta.accounts.map(a=>[a.id,a.initial||0]));for(const t of tx.values()){const k=accOf(t);if(m.has(k)) m.set(k,m.get(k)+(t.type==='in'?t.amount:-t.amount));}return m;}
function usage(){const m=new Map();for(const t of tx.values()) m.set(t.cat,(m.get(t.cat)||0)+1);return m;}
const signCls=v=>v<0?'neg':(v>0?'pos':'');
const cfg=c=>look()==='b'?mix(c.color,'#FFFFFF',.3):c.color;
const cbg=c=>rgba(c.color,look()==='b'?.24:.14);
const bub=(c,size)=>ui.icons==='linha'?`<span class="bub" style="width:${size}px;height:${size}px;background:${cbg(c)};color:${cfg(c)}">${ic(c.icon)}</span>`:`<span class="bub bill" style="width:${size}px;height:${size}px">${catIco(c.icon)}</span>`;
const monthRange=(y,m)=>[`${y}-${pad(m)}-01`,`${y}-${pad(m)}-${pad(lastDay(y,m))}`];
const yearRange=y=>[`${y}-01-01`,`${y}-12-31`];
const valTxt=t=>(t.type==='in'?'+ ':'− ')+fmt(t.amount);
function sortTx(list,order){const k=t=>t.date+time24(t.time);return list.sort((a,b)=>order==='asc'?(k(a)<k(b)?-1:k(a)>k(b)?1:0):(k(a)<k(b)?1:k(a)>k(b)?-1:0));}

/* ================= estrutura e navegação ================= */
const mqWide=window.matchMedia?window.matchMedia('(min-width: 1101px)'):null;
const DOCK_TABS=['home','mov','cal'];
function docked(){return !!(mqWide?mqWide.matches:true)&&DOCK_TABS.includes(ui.tab)&&!!meta;}
function render(){
  document.documentElement.dataset.look=look();applyPalette();
  renderChrome();
  const dk=docked();$('shell').classList.toggle('nodock',!dk);placeForm(dk);$('fab').hidden=dk||!meta;
  renderBanner();
  const v=$('view');
  if(!meta){v.innerHTML='<div class="empty"><b>Carregando seus lançamentos…</b></div>';return;}
  if(ui.acc!=='all'&&!meta.accounts.some(a=>a.id===ui.acc)) ui.acc='all';
  const views={home:viewHome,mov:viewMov,cal:viewCal,rdata:viewRData,rcat:viewRCat,cfg:viewCfg,cats:viewCats,look:viewLook,bak:viewBak};
  v.innerHTML=(views[ui.tab]||viewHome)();
  $('foot').textContent=mode==='db'?'Seus lançamentos ficam salvos na sua conta e só você os vê.':mode==='local'?(D?'Os dados ficam salvos neste computador, com uma cópia automática por dia.':'Os dados ficam salvos apenas neste navegador.'):'';
}
function renderChrome(){
  const lk=look();
  const btn=([k,l,i])=>`<button data-tab="${k}" ${ui.tab===k?'aria-current="page"':''}>${ic(i)}<span>${l}</span></button>`;
  const brand=`<div class="brand"><img class="logo" src="${LOGO}" alt=""><b>${APP}</b></div>`;
  if(lk==='a'){
    let accts='';
    if(ui.acc!=='all'){ui.acc='all';rememberUI();}
    if(meta){const R=cashSummary();
      const since=R.first?(()=>{const d=fromISO(R.first);return `desde ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;})():'nenhum lançamento ainda';
      accts=`<div class="accts"><span class="lbl">Resumo geral</span><span class="since">${since}</span>
        <div class="tot"><span>Receitas totais</span><span class="num in">${fmt(R.i)}</span></div>
        <div class="tot"><span>Despesas totais</span><span class="num out">${fmt(R.o)}</span></div>
        <div class="tot sum"><span>Saldo atual</span><span class="num ${R.saldo<0?'out':''}">${fmt(R.saldo)}</span>${R.base?`<small class="hint">a partir do ajuste de ${cap(MES[+R.base.slice(5)-1])}/${R.base.slice(0,4)}</small>`:''}</div></div>`;}
    $('side').innerHTML=`${brand}<nav aria-label="Menu">${NAV.map(btn).join('')}<span class="lbl">Opções</span>${OPT.map(btn).join('')}</nav>${accts}`;
    $('topbar').innerHTML='';
  } else {
    const inOpt=OPT.some(o=>o[0]===ui.tab);
    const sel=meta&&meta.accounts.length>1?`<select id="acctSel" class="sel" aria-label="Conta"><option value="all">Todas as contas</option>${meta.accounts.map(a=>`<option value="${esc(a.id)}" ${ui.acc===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:'';
    $('topbar').innerHTML=`${brand}<nav aria-label="Menu">${NAV.map(btn).join('')}<button id="optBtn" aria-haspopup="true" aria-expanded="${ui.optOpen}" ${inOpt&&!ui.optOpen?'aria-current="page"':''}>${ic('ajustes')}<span>Opções</span>${ic('baixo')}</button></nav><div class="topright">${sel}</div>
      ${ui.optOpen?`<div class="optmenu" id="optMenu" style="right:32px">${OPT.map(([k,l,i])=>`<button data-tab="${k}" ${ui.tab===k?'aria-current="page"':''}>${ic(i)}${l}</button>`).join('')}</div>`:''}`;
    $('side').innerHTML='';
  }
}
function renderBanner(){const b=$('banner');let hasDemo=false;for(const t of tx.values()){if(t.demo){hasDemo=true;break;}}
  if(hasDemo&&mode!=='demo'){b.hidden=false;b.innerHTML='<span><b>Estes são lançamentos de exemplo.</b> Apague-os ou restaure seu backup em Opções › Backup.</span><button id="clearDemo">Apagar exemplos</button>';return;}
  b.hidden=true;}

/* ================= listas de lançamentos ================= */
function emptyHTML(msg){return tx.size===0?`<div class="empty"><b>Nenhum lançamento ainda</b>Registre o primeiro, ou restaure o backup do Gastos Diários em Opções › Backup.</div>`:`<div class="empty"><b>Nada por aqui</b>${msg||'Nenhum lançamento neste período.'}</div>`;}
function rowHTML(t,showAcc){const c=catById(t.cat);const sub=[t.desc?c.name:'',showAcc?accById(accOf(t)).name:'',t.rule?'repete':''].filter(Boolean).join(' · ');
  return `<button class="row" data-edit="${esc(t.id)}">${bub(c,38)}<span class="t"><b>${esc(t.desc||c.name)}</b><small>${esc(sub)}</small></span><span class="num ${t.type==='in'?'pos':'neg'}">${valTxt(t)}</span></button>`;}
function rowsA(list,showAcc){
  const groups=new Map();for(const t of list){if(!groups.has(t.date))groups.set(t.date,[]);groups.get(t.date).push(t);}
  let h='<div class="ledger">';
  for(const [d,items] of groups){const dt=totals(items);
    h+=`<section class="card day"><div class="dayhead"><span>${fromISO(d).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span><span class="num ${signCls(dt.b)}">${fmt(dt.b)}</span></div>${items.map(t=>rowHTML(t,showAcc)).join('')}</section>`;}
  return h+'</div>';
}
function tableB(list,title,extra){
  let h=`<section class="card table"><div class="thead"><h2>${title}</h2>${extra||''}</div>`;
  if(!list.length) return h+`<div style="padding:0 22px 22px">${emptyHTML()}</div></section>`;
  h+=`<div class="tscroll"><div class="tgrid"><div class="tr th"><span>Data</span><span>Categoria</span><span>Conta</span><span class="r">Valor</span></div>`;
  for(const t of list){const c=catById(t.cat);const d=fromISO(t.date);
    h+=`<button class="tr" data-edit="${esc(t.id)}"><span class="m">${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}</span><span class="cat">${bub(c,32)}<span>${esc(c.name)}${t.desc?` <span style="color:var(--muted)">· ${esc(t.desc)}</span>`:''}</span></span><span class="m">${esc(accById(accOf(t)).name)}</span><span class="num r ${t.type==='in'?'pos':'neg'}">${valTxt(t)}</span></button>`;}
  return h+'</div></div></section>';
}
function summaryHTML(T,acc,label){return `<div class="card summary">
  <div><span class="lbl">Receitas</span><strong class="num pos">${fmt(T.i)}</strong></div>
  <div><span class="lbl">Despesas</span><strong class="num neg">${fmt(T.o)}</strong></div>
  <div><span class="lbl">${label||'Saldo do período'}</span><strong class="num ${signCls(T.b)}">${fmt(T.b)}</strong></div></div>`;}

/* ================= Tela inicial ================= */
function hourGreeting(){const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';}
function viewHome(){
  const today=todayISO();const d0=fromISO(today);const ry=d0.getFullYear(),rm=d0.getMonth()+1;
  const [s,e]=monthRange(ry,rm);const list=inRange(s,e);const T=totals(list);
  const bal=balanceUntil('9999-12-31');
  const recent=sortTx([...tx.values()].filter(accOk),'desc').slice(0,7);
  const top=new Map();for(const t of list) if(t.type==='out') top.set(t.cat,(top.get(t.cat)||0)+t.amount);
  const topRows=[...top].sort((a,b)=>b[1]-a[1]).slice(0,5);const max1=topRows.length?topRows[0][1]:1;
  const mlabel=`${cap(MES[rm-1])} de ${ry}`;
  const months=[];for(let i=5;i>=0;i--){const [y,m]=stepYM(ry,rm,-i);const [a,b]=monthRange(y,m);months.push({label:cap(MES3[m-1])+(m===1||i===5?' '+String(y).slice(2):''),...totals(inRange(a,b))});}
  const showAcc=ui.acc==='all'&&meta.accounts.length>1;
  return `<div class="stack">
   <div><h1 class="title">${hourGreeting()}!</h1><p class="note">${longDate(today)}</p></div>
   <div class="grid2">
    <section class="card hero"><span class="lbl">Saldo do mês · ${mlabel}</span><span class="num amt ${signCls(T.b)}">${fmt(T.b)}</span>
      <span class="note">${T.n?`${T.n} lançamento${T.n>1?'s':''} neste mês`:'Nenhum lançamento neste mês ainda.'}</span>
      <div class="kpis"><div><small>Receitas do mês</small><span class="num pos">${fmt(T.i)}</span></div><div><small>Despesas do mês</small><span class="num neg">${fmt(T.o)}</span></div></div></section>
    <section class="card panel"><h3>Maiores despesas · ${mlabel}</h3>
      ${topRows.length?topRows.map(([id,v])=>{const c=catById(id);return `<div class="toprow"><span class="tico" style="color:${cfg(c)}">${catIco(c.icon)}</span><span class="nm">${esc(c.name)}</span><span class="track"><i style="width:${(v/max1*100).toFixed(1)}%;background:${cfg(c)}"></i></span><span class="num">${fmt(v)}</span></div>`;}).join(''):'<p class="note">Nenhuma despesa neste mês ainda.</p>'}
    </section></div>
   <div class="grid2">
    <section class="card panel"><div class="vhead"><h3>Últimos lançamentos</h3><button class="linkbtn" data-tab="mov">Ver todos</button></div>
      ${recent.length?`<div class="flush">${recent.map(t=>rowHTML(t,showAcc)).join('')}</div>`:'<p class="note">Nenhum lançamento ainda.</p>'}</section>
    <section class="card panel"><div class="vhead"><h3>Últimos 6 meses</h3><button class="linkbtn" data-tab="rdata">Relatórios</button></div><div class="legend"><span><i style="background:var(--in)"></i>Receitas</span><span><i style="background:var(--out)"></i>Despesas</span></div>${barChart(months,{w:440,h:240})}</section>
   </div></div>`;
}

/* ================= Movimentos ================= */
function viewMov(){
  const [s,e]=ui.movM?monthRange(ui.movY,ui.movM):yearRange(ui.movY);
  const all=inRange(s,e);const T=totals(all);const acc=balanceUntil(e);const q=norm(ui.q);
  const list=sortTx(all.filter(t=>(ui.ftype==='all'||t.type===ui.ftype)&&(!q||norm(t.desc).includes(q)||norm(catById(t.cat).name).includes(q))),ui.movOrder);
  const title=ui.movM?`${cap(MES[ui.movM-1])} de ${ui.movY}`:`Ano de ${ui.movY}`;
  const ctrls=`<div class="ctrls">${navBtns('mov-prev','mov-next')}${yearSel('movY',ui.movY)}${monthSel('movM',ui.movM,true)}
    <select class="sel" id="movOrder" aria-label="Ordem"><option value="desc" ${ui.movOrder==='desc'?'selected':''}>Decrescente (mais recentes primeiro)</option><option value="asc" ${ui.movOrder==='asc'?'selected':''}>Crescente (mais antigos primeiro)</option></select></div>`;
  const filters=`<div class="filters"><label class="search">${ic('busca')}<input id="q" type="search" placeholder="Buscar descrição ou categoria" value="${esc(ui.q)}" aria-label="Buscar"></label>${[['all','Todos'],['in','Receitas'],['out','Despesas']].map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${ui.ftype===k}">${l}</button>`).join('')}</div>`;
  let h=`<div class="stack"><div class="vhead"><h1 class="title">${title}</h1>${ctrls}</div>${summaryHTML(T,acc)}`;
  const shown=list.slice(0,ui.limit);const showAcc=ui.acc==='all'&&meta.accounts.length>1;
  if(look()==='b') h+=tableB(shown,`Lançamentos <span class="note" style="font-weight:400">· ${list.length.toLocaleString('pt-BR')}</span>`,filters);
  else h+=filters+(list.length?rowsA(shown,showAcc):emptyHTML());
  if(list.length>ui.limit) h+=`<button class="btn sec more" data-act="more">Mostrar mais (${(list.length-ui.limit).toLocaleString('pt-BR')} restantes)</button>`;
  return h+'</div>';
}

/* ================= Calendário ================= */
function viewCal(){
  const y=ui.calY,m=ui.calM;const [s,e]=monthRange(y,m);const list=inRange(s,e);const T=totals(list);const acc=balanceUntil(e);
  const byDay=new Map();for(const t of list){const d=+t.date.slice(8);const r=byDay.get(d)||{i:0,o:0};if(t.type==='in')r.i+=t.amount;else r.o+=t.amount;byDay.set(d,r);}
  const first=new Date(y,m-1,1).getDay();const dim=lastDay(y,m);const today=todayISO();
  let cells=WD.map(w=>`<span class="wd">${w}</span>`).join('');
  for(let i=0;i<first;i++) cells+='<span class="cday blank"></span>';
  for(let d=1;d<=dim;d++){const iso=`${y}-${pad(m)}-${pad(d)}`;const r=byDay.get(d);
    cells+=`<button class="cday${iso===today?' today':''}" data-day="${iso}" aria-pressed="${ui.calDay===iso}" aria-label="${longDate(iso)}"><span class="d">${d}</span>${r&&r.i?`<span class="v num pos">+${fmtShort(r.i)}</span>`:''}${r&&r.o?`<span class="v num neg">−${fmtShort(r.o)}</span>`:''}</button>`;}
  const sel=ui.calDay&&ui.calDay.slice(0,7)===`${y}-${pad(m)}`?ui.calDay:null;

      ${items.map(t=>rowHTML(t,ui.acc==='all'&&meta.accounts.length>1)).join('')}</section>`;}
  return `<div class="stack"><div class="vhead"><h1 class="title">${cap(MES[m-1])} de ${y}</h1><div class="ctrls">${navBtns('cal-prev','cal-next')}${yearSel('calY',y)}${monthSel('calM',m,false)}<button class="linkbtn" data-act="cal-today">Hoje</button></div></div>
    ${summaryHTML(T,acc,'Saldo do mês')}

/* ================= gráfico de barras ================= */
function niceStep(max,n){const raw=max/n,p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function barChart(rows,opt={}){
  const n=rows.length;if(!n) return '';const max=Math.max(1,...rows.map(r=>Math.max(r.i,r.o)));const step=niceStep(max,4),top=Math.ceil(max/step)*step;
  const W=Math.max(opt.w||760,Math.min(1200,n*46+80)),H=opt.h||260,L=66,R=10,TP=12,B=30,ch=H-TP-B,cw=(W-L-R)/n,bw=Math.max(2,Math.min(16,cw*.32));const y=v=>TP+ch-(v/top)*ch;let g='';
  for(let v=0;v<=top+1;v+=step) g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${(v/100).toLocaleString('pt-BR',{maximumFractionDigits:0})}</text>`;
  const every=n>24?Math.ceil(n/16):1;
  rows.forEach((r,k)=>{const cx=L+cw*k+cw/2;
    g+=`<rect class="b-in" x="${cx-bw-1}" y="${y(r.i)}" width="${bw}" height="${Math.max(0,TP+ch-y(r.i))}" rx="2"><title>${esc(r.full||r.label)} · Receitas ${fmt(r.i)}</title></rect><rect class="b-out" x="${cx+1}" y="${y(r.o)}" width="${bw}" height="${Math.max(0,TP+ch-y(r.o))}" rx="2"><title>${esc(r.full||r.label)} · Despesas ${fmt(r.o)}</title></rect>`;
    if(k%every===0) g+=`<text x="${cx}" y="${H-10}" text-anchor="middle">${esc(r.label)}</text>`;});
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" style="min-width:${n>14?Math.round(W*.7):0}px" role="img" aria-label="Receitas e despesas, em reais">${g}</svg></div>`;
}

  else if(mode==='mes'){rows=MES.map((nm,i)=>{const [a,b]=monthRange(ui.rdY,i+1);return {label:cap(MES3[i]),full:cap(nm),key:`${ui.rdY}-${pad(i+1)}`,...totals(inRange(a,b))};});title=`Por mês · ${ui.rdY}`;ctrls=`${navBtns('rd-prev','rd-next')}${yearSel('rdY',ui.rdY)}`;}
  else{const dim=lastDay(ui.rdY,ui.rdM);for(let d=1;d<=dim;d++){const iso=`${ui.rdY}-${pad(ui.rdM)}-${pad(d)}`;rows.push({label:String(d),full:cap(fromISO(iso).toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'})),key:iso,...totals(inRange(iso,iso))});}

     <div class="rrow th"><span>${mode==='ano'?'Ano':mode==='mes'?'Mês':'Dia'}</span><span class="r">Receitas</span><span class="r">Despesas</span><span class="r">Saldo</span><span class="r">Lanç.</span></div>
     ${tableRows.length?tableRows.map(r=>`<button class="rrow" data-rdrow="${r.key}"><span>${esc(r.full||r.label)}</span><span class="num r pos">${fmt(r.i)}</span><span class="num r neg">${fmt(r.o)}</span><span class="num r ${signCls(r.i-r.o)}">${fmt(r.i-r.o)}</span><span class="num r" style="color:var(--muted)">${r.n}</span></button>`).join(''):`<div style="padding:16px 18px" class="note">Nenhum lançamento neste período.</div>`}

function rcRange(){if(ui.rcMode==='dia') return [ui.rcDay,ui.rcDay];if(ui.rcMode==='mes') return monthRange(ui.rcY,ui.rcM);return yearRange(ui.rcY);}
function viewRCat(){
  const [s,e]=rcRange();const list=inRange(s,e).filter(t=>t.type===ui.rcType);const q=norm(ui.rcQ);
  const sums=new Map();for(const t of list){const r=sums.get(t.cat)||{v:0,n:0};r.v+=t.amount;r.n++;sums.set(t.cat,r);}
  const cats=meta.categories.filter(c=>c.type===ui.rcType&&(!q||norm(c.name).includes(q)));
  const withV=cats.filter(c=>sums.has(c.id)).sort((a,b)=>sums.get(b.id).v-sums.get(a.id).v);
  const zero=cats.filter(c=>!sums.has(c.id)).sort(byName);
  const total=withV.reduce((a,c)=>a+sums.get(c.id).v,0);
  const maxV=withV.length?sums.get(withV[0].id).v:1;const showBud=ui.rcType==='out'&&ui.rcMode==='mes';
  const period=ui.rcMode==='dia'?longDate(ui.rcDay):ui.rcMode==='mes'?`${cap(MES[ui.rcM-1])} de ${ui.rcY}`:`Ano de ${ui.rcY}`;

  const items=withV.map(c=>{const r=sums.get(c.id);const bud=showBud?c.budget||0:0;const open=ui.rcOpen===c.id;
    let h=`<div class="catitem"><button class="catbtn" data-rcopen="${esc(c.id)}" aria-expanded="${open}">${bub(c,36)}<b style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</b><span class="num">${fmt(r.v)}</span><span class="chev">${ic('direita')}</span>
      <span class="track"><i style="width:${(r.v/maxV*100).toFixed(1)}%;background:${cfg(c)}"></i></span>

    if(open) h+=`<div class="catentries">${sortTx(list.filter(t=>t.cat===c.id),'desc').map(t=>`<button class="row" data-edit="${esc(t.id)}"><span class="t"><b>${esc(t.desc||c.name)}</b><small>${fromISO(t.date).toLocaleDateString('pt-BR')}${meta.accounts.length>1?' · '+esc(accById(accOf(t)).name):''}</small></span><span class="num ${t.type==='in'?'pos':'neg'}">${valTxt(t)}</span></button>`).join('')}</div>`;
    return h+'</div>';}).join('');
  return `<div class="stack"><div class="vhead"><h1 class="title">Relatório por categoria</h1>
     <div class="ctrls"><div class="segv" role="group" aria-label="Tipo">${[['out','Despesas'],['in','Receitas']].map(([k,l])=>`<button data-rctype="${k}" aria-pressed="${ui.rcType===k}">${l}</button>`).join('')}</div>
     <div class="segv" role="group" aria-label="Período">${[['dia','Diário'],['mes','Mensal'],['ano','Anual']].map(([k,l])=>`<button data-rcmode="${k}" aria-pressed="${ui.rcMode===k}">${l}</button>`).join('')}</div></div></div>
   <div class="vhead"><div class="ctrls">${ctrls}</div><label class="search" style="max-width:340px">${ic('busca')}<input id="rcQ" type="search" placeholder="Buscar categoria" value="${esc(ui.rcQ)}" aria-label="Buscar categoria"></label></div>
   <section class="card" style="overflow:hidden">
     <div class="vhead" style="padding:16px 18px;border-bottom:1px solid var(--line)"><div><h3 style="margin:0;font:600 18px var(--f-display)">${ui.rcType==='out'?'Despesas':'Receitas'} · ${esc(period)}</h3><span class="note">${withV.length} de ${cats.length} categorias com lançamentos${showBud?' · orçamento mensal indicado':''}. Clique numa categoria para ver os lançamentos.</span></div><span class="num ${ui.rcType==='out'?'neg':'pos'}" style="font-size:20px">${fmt(total)}</span></div>
     ${withV.length?items:`<div style="padding:18px">${emptyHTML(q?`Nenhuma categoria com "${esc(ui.rcQ)}" teve lançamentos.`:'Nenhum lançamento deste tipo no período.')}</div>`}
     ${zero.length?`<details class="zero"><summary>Categorias sem lançamentos no período (${zero.length})</summary><div class="zerolist">${zero.map(c=>`<span>${bub(c,22)}${esc(c.name)}</span>`).join('')}</div></details>`:''}
   </section></div>`;
}

  saveMeta();CE[ctx]=null;toast(e.id?'Categoria atualizada':'Categoria criada');return id;}

  if(b.id==='pkMode'){F.mode=F.mode==='edit'?'pick':'edit';CE.f=null;CD.f=null;renderPicker();return;}

  if(b.dataset.xdel){startDelete('f',b.dataset.xdel);renderTiles();return;}

  if(b.dataset.newcat){CE.f=newCatEditor(F.type,F.q);CD.f=null;renderTiles();setTimeout(()=>{const i=lform.querySelector('[data-cename]');if(i)i.focus();},20);return;}
  if(b.dataset.ceicon){CE.f.icon=b.dataset.ceicon;if(!CE.f.colorTouched) CE.f.color=ICON_COLOR[b.dataset.ceicon]||CE.f.color;keepIcScroll(renderTiles);return;}
  if(b.dataset.cecolor){CE.f.color=b.dataset.cecolor;CE.f.colorTouched=true;keepIcScroll(renderTiles);return;}
  if(b.dataset.ceact==='cancel'){CE.f=null;renderTiles();return;}
  if(b.dataset.ceact==='save'){const was=CE.f.id;const id=saveCatEditor('f');if(id){if(!was){F.cat=id;F.mode='pick';}renderPicker();render();}return;}

document.addEventListener('click',async e=>{
  const b=e.target.closest('button');
  if(ui.optOpen&&(!b||(b.id!=='optBtn'&&!b.closest('#optMenu')))){ui.optOpen=false;renderChrome();}
  if(!b||lform.contains(b)) return;
  if(b.id==='optBtn'){ui.optOpen=!ui.optOpen;renderChrome();return;}
  if(b.dataset.tab){go(b.dataset.tab);return;}
  if(b.dataset.look){setLook(b.dataset.look);return;}
  if(b.dataset.icostyle){ui.icons=b.dataset.icostyle;rememberUI();render();if(F.ready) renderPicker();return;}
  if(b.dataset.pal){ui.palette=b.dataset.pal;rememberUI();render();if(F.ready) renderPicker();return;}
  if(b.dataset.acc){ui.acc=b.dataset.acc;rememberUI();render();return;}
  if(b.id==='fab'){openForm(null,ui.tab==='cal'?ui.calDay:null);return;}
  if(b.id==='clearDemo'){const months=new Set();for(const t of [...tx.values()]) if(t.demo){tx.delete(t.id);months.add(monthKey(t.date));}if(mode==='db') months.forEach(k=>persistMonth(k).catch(dbFail)); else if(mode==='local') saveLocal();render();toast('Exemplos apagados');return;}
  if(b.dataset.edit){openForm(tx.get(b.dataset.edit));return;}
  if(b.dataset.f){ui.ftype=b.dataset.f;render();return;}
  const act=b.dataset.act;
  if(act){
    if(act==='more') ui.limit+=500;
    else if(act==='mov-prev'||act==='mov-next'){const d=act==='mov-prev'?-1:1;if(ui.movM){[ui.movY,ui.movM]=stepYM(ui.movY,ui.movM,d);}else ui.movY+=d;ui.limit=300;}
    else if(act==='cal-prev'||act==='cal-next'){[ui.calY,ui.calM]=stepYM(ui.calY,ui.calM,act==='cal-prev'?-1:1);}
    else if(act==='cal-today'){const d=new Date();ui.calY=d.getFullYear();ui.calM=d.getMonth()+1;ui.calDay=todayISO();}

async function readImport(file){if(!file) return;const box=$('impConfirm');box.hidden=false;box.innerHTML='<p class="note">Lendo o arquivo…</p>';
  try{const buf=new Uint8Array(await file.arrayBuffer());const isSqlite=String.fromCharCode(...buf.slice(0,15))==='SQLite format 3';
    if(isSqlite){box.innerHTML='<p class="note">Abrindo o banco de dados do Gastos Diários…</p>';
      let SQL;try{SQL=await loadSql();}catch(e){box.innerHTML='<p class="note">Não consegui carregar o leitor de SQLite. '+(D?'Reinstale o programa e tente de novo.':'Verifique a conexão e tente de novo.')+'</p>';return;}
      let r;try{r=parseGastosDiarios(SQL,buf);}catch(e){box.innerHTML='<p class="note">Este arquivo SQLite não tem as tabelas do Gastos Diários (table_movements). Confira se escolheu o backup certo.</p>';return;}
      pendingImport={meta:r.meta,tx:r.tx};const notes=[];
      if(r.info.skipped) notes.push(`${r.info.skipped} lançamentos sem data ou valor foram ignorados.`);
      if(r.info.autos) notes.push(`${r.info.autos} lançamentos automáticos do Gastos Diários ficam guardados para a exportação, mas não são repetidos aqui; recrie-os com "Repetir".`);
      box.innerHTML=`<p class="note"><b>Backup do Gastos Diários encontrado.</b> Os ícones das categorias são escolhidos pelo nome; você pode trocar depois.</p>${factsHTML(r.meta,r.tx,notes.length?`<p class="note">${notes.join(' ')}</p>`:'')}<p class="note">"Substituir" deixa tudo igual ao backup. "Juntar" acrescenta ao que já existe: lançamentos iguais (mesma data, hora, valor, categoria, conta e descrição) não são duplicados.</p>${IMP_BTNS}`;return;}
    const d=JSON.parse(new TextDecoder().decode(buf));if(!d||!Array.isArray(d.tx)||!d.meta||!Array.isArray(d.meta.categories)) throw 0;
    const list=d.tx.filter(t=>t&&t.id&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&Number.isFinite(t.amount)&&(t.type==='in'||t.type==='out')).map(({demo,...t})=>t);
    const m=normalizeMeta(clone(d.meta));pendingImport={meta:m,tx:list};box.innerHTML=`<p class="note"><b>Backup encontrado.</b></p>${factsHTML(m,list)}${IMP_BTNS}`;
  }catch(e){box.innerHTML='<p class="note">Não reconheci este arquivo. Escolha o database.sqlite do Gastos Diários ou um backup .json.</p>';}}
async function doImport(how){if(!pendingImport) return;const P=pendingImport;pendingImport=null;const box=$('impConfirm');
  box.innerHTML='<p class="note" id="impMsg">Preparando…</p><div class="progress"><i id="impBar"></i></div>';
  const oldMonths=new Set([...tx.values()].map(t=>monthKey(t.date)));
  if(how==='replace'){meta=normalizeMeta(P.meta);tx=new Map(P.tx.map(t=>[t.id,t]));}
  else{const accMap={},catMap={};
    for(const a of P.meta.accounts){const ex=meta.accounts.find(x=>norm(x.name)===norm(a.name));if(ex){accMap[a.id]=ex.id;if(!ex.gd&&a.gd)ex.gd=a.gd;}else{meta.accounts.push(a);accMap[a.id]=a.id;}}
    for(const c of P.meta.categories){const ex=meta.categories.find(x=>x.type===c.type&&norm(x.name)===norm(c.name));if(ex){catMap[c.id]=ex.id;if(!ex.budget&&c.budget)ex.budget=c.budget;}else{meta.categories.push(c);catMap[c.id]=c.id;}}
    if(P.meta.extras){const X=meta.extras||{};const icons={...(X.icons||{})};for(const [k,v] of Object.entries(P.meta.extras.icons||{})) icons[catMap[k]||k]=v;
      const ca={...(X.catAccounts||{})};for(const [k,v] of Object.entries(P.meta.extras.catAccounts||{})){const id=catMap[k]||k;ca[id]=[...new Set([...(ca[id]||[]),...v.map(a=>accMap[a]||a)])];}
      meta.extras={...P.meta.extras,...X,icons,catAccounts:ca};}
    for(const r of (P.meta.rules||[])) if(!meta.rules.some(x=>x.id===r.id)) meta.rules.push({...r,cat:catMap[r.cat]||r.cat,acc:accMap[r.acc]||r.acc});
    /* Junta pelo conteúdo, não pelo número: backups de instalações diferentes do Gastos Diários reaproveitam os mesmos números. */
    const pCat=new Map(P.meta.categories.map(c=>[c.id,c.name])),pAcc=new Map(P.meta.accounts.map(a=>[a.id,a.name]));
    const fp=(t,cn,an)=>[t.date,t.type,t.amount,norm(cn),norm(t.desc),norm(an),time24(t.time)].join('|');
    const exist=new Map();for(const t of tx.values()){const k=fp(t,catById(t.cat).name,accById(accOf(t)).name);if(!exist.has(k))exist.set(k,[]);exist.get(k).push(t.id);}
    let added=0,same=0;
    for(const t of P.tx){const k=fp(t,pCat.get(t.cat)||'',pAcc.get(t.acc)||'');const hit=exist.get(k);
      if(hit&&hit.length){hit.shift();same++;continue;}
      let id=t.id;while(tx.has(id)) id='m_'+uid();
      tx.set(id,{...t,id,cat:catMap[t.cat]||t.cat,acc:accMap[t.acc]||t.acc});added++;}
    P.result=`${added.toLocaleString('pt-BR')} lançamentos acrescentados${same?`, ${same.toLocaleString('pt-BR')} já existiam`:''}`;
    meta=normalizeMeta(meta);}
  for(const t of [...tx.values()]) if(t.demo) tx.delete(t.id);
  ui.acc='all';F.ready=false;
  if(mode==='db'){const months=new Set([...tx.values()].map(t=>monthKey(t.date)));oldMonths.forEach(k=>months.add(k));const keys=[...months].sort();let done=0,failed=false;
    try{await serial('meta',()=>withRetry(()=>metaRef.set(clone(meta))));metaSaved=true;}catch(e){failed=true;}
    for(const k of keys){if(failed)break;try{await persistMonth(k);}catch(e){failed=true;break;}done++;const bar=$('impBar'),msg=$('impMsg');if(bar)bar.style.width=(done/keys.length*100).toFixed(1)+'%';if(msg)msg.textContent=`Salvando na sua conta… ${done} de ${keys.length} meses`;}
    toast(failed?'A importação parou no meio. Escolha o arquivo de novo e use "Juntar" para completar.':(P.result||`${P.tx.length.toLocaleString('pt-BR')} lançamentos importados`));}
  else{mode='local';saveLocal();toast(P.result||`${P.tx.length.toLocaleString('pt-BR')} lançamentos importados`);}
  focusLatest();go('home');resetForm(false);}

/* ================= aviso ================= */
let tt=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200);}

/* ================= início ================= */
function loadDemo(){const d=demoData();meta=d.meta;tx=new Map(d.tx.map(t=>[t.id,t]));}
function applySaved(saved){meta=normalizeMeta(saved.meta);tx=new Map((saved.tx||[]).map(t=>[t.id,t]));}
function begin(){runRecurring();focusLatest();render();resetForm(false);}
async function startLocal(){mode='local';let saved=null;try{const raw=PWA?await IDB.get(LS_KEY):null;saved=JSON.parse(raw||localStorage.getItem(LS_KEY)||localStorage.getItem(LS_OLD)||'null');}catch(e){}
  if(PWA&&navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if(saved&&saved.meta) applySaved(saved); else{loadDemo();saveLocal();}begin();}
window.__finora={get meta(){return meta;},get tx(){return tx;},get ui(){return ui;},render,setLook,go};
render();
(async()=>{
  if(D){mode='local';let saved=null;try{const txt=await D.load();saved=txt?JSON.parse(txt):null;}catch(e){toast('O arquivo de dados está danificado. Restaure uma cópia automática em Opções › Backup.');}
    if(saved&&saved.meta) applySaved(saved); else{loadDemo();saveLocal();}begin();return;}
  const C=window.claude;if(!C||!C.use){startLocal();return;}
  let db=null,user=null;try{[db,user]=await Promise.all([C.use('db'),C.use('user')]);}catch(e){}
  let id=null;try{id=user?await user.id():null;}catch(e){}
  if(!db||!id){startLocal();return;}
  mode='db';meta=null;tx=new Map();render();
  metaRef=db.doc(`data/users/${id}/caixa`);monthsCol=metaRef.collection('meses');
  let gotMeta=false,gotTx=false,focused=false,migrated=false;
  const ready=async()=>{if(!gotMeta||!gotTx) return;if(!focused){focused=true;focusLatest();}render();if(!F.ready) resetForm(false);else renderPicker();
    if(migrated) return;migrated=true;
    try{const old=await metaRef.collection('lancamentos').get();if(!old.empty){const months=new Set();for(const d of old.docs){const t=clone(d.data());if(t&&t.date&&!tx.has(d.id)){tx.set(d.id,t);months.add(monthKey(t.date));}}
      for(const k of months) await persistMonth(k);for(const d of old.docs) await withRetry(()=>metaRef.collection('lancamentos').doc(d.id).delete());render();}}catch(e){}
    runRecurring();render();};
  metaRef.onSnapshot(s=>{if(s.exists){meta=normalizeMeta(clone(s.data()));metaSaved=true;}else if(!meta){meta=defaultMeta();}gotMeta=true;ready();},()=>toast('Conexão com sua conta perdida. Recarregue a página.'));
  monthsCol.onSnapshot(qs=>{const next=new Map();for(const d of qs.docs){const items=(d.data()||{}).items||{};for(const k in items) next.set(k,{...items[k],id:k});}
    for(const k of pendingMonth){for(const t of tx.values()) if(monthKey(t.date)===k) next.set(t.id,t);}tx=next;gotTx=true;ready();},()=>toast('Conexão com sua conta perdida. Recarregue a página.'));
})();
})();
</script>
